# vim: expandtab tabstop=2 shiftwidth=2
name: Check for new Ghidra release

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for new Ghidra release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/NationalSecurityAgency/ghidra/releases/latest --jq '.tag_name' | sed 's/^Ghidra_//;s/_build$//')
          KNOWN=$(cat .github/last-ghidra-version 2>/dev/null || echo "")

          if [ "$LATEST" = "$KNOWN" ]; then
            echo "No new Ghidra release (latest: $LATEST)"
            exit 0
          fi

          echo "New Ghidra release detected: $LATEST (was: ${KNOWN:-none})"
          echo "$LATEST" > .github/last-ghidra-version

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-ghidra-version
          git commit -m "chore: track Ghidra $LATEST"
          git push

          gh workflow run main.yml --repo "${{ github.repository }}"
