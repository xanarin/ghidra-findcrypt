# vim: expandtab tabstop=2 shiftwidth=2
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/NationalSecurityAgency/ghidra/releases/latest --jq '.tag_name' | sed 's/^Ghidra_//;s/_build$//')
          MATRIX=$(printf '["12.1"]' | jq -c --arg v "$LATEST" '. + [$v] | unique')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: get-versions
    strategy:
      fail-fast: false
      matrix:
        ghidra-version: ${{ fromJson(needs.get-versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    container: gradle:latest
    steps:
      - name: Install dependencies
        run: apt-get update -qq && apt-get install -y --no-install-recommends git curl jq unzip

      - uses: actions/checkout@v4

      - name: Download Ghidra ${{ matrix.ghidra-version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_URL=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/tags/Ghidra_${{ matrix.ghidra-version }}_build" \
            | jq -r '.assets[] | select(.name | test("ghidra_.*\\.zip$")) | .browser_download_url')
          curl -fsSL "$ASSET_URL" -o /tmp/ghidra.zip
          unzip -q /tmp/ghidra.zip -d /tmp/ghidra
          echo "GHIDRA_INSTALL_DIR=$(find /tmp/ghidra -maxdepth 1 -type d -name 'ghidra_*')" >> $GITHUB_ENV

      - name: Build FindCrypt for Ghidra ${{ matrix.ghidra-version }}
        run: cd FindCrypt && gradle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindCrypt-ghidra-${{ matrix.ghidra-version }}
          path: FindCrypt/dist/*.zip
          if-no-files-found: error

  upload-release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" artifacts/*.zip --repo "${{ github.repository }}"
